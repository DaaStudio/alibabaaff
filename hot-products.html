<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Hot Products — Alibaba Affiliate</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #111a2e;
    --card: #131e35;
    --card2: #1a2742;
    --text: #eef2f9;
    --text-dim: #8c9bb5;
    --brand: #ff6a00;
    --brand2: #ff8c42;
    --brand-soft: rgba(255,106,0,0.12);
    --blue: #2b7fff;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --shadow: rgba(0,0,0,0.5);
    --header-bg: rgba(11,18,32,0.92);
    --success: #16a34a;
  }
  [data-theme="light"] {
    --bg: #f5f7fb;
    --bg2: #eaeef6;
    --card: #ffffff;
    --card2: #f2f5fa;
    --text: #0d1a2e;
    --text-dim: #5b6b84;
    --brand: #e85d00;
    --brand2: #ff7a1a;
    --brand-soft: rgba(232,93,0,0.10);
    --blue: #1a6dff;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --shadow: rgba(0,0,0,0.10);
    --header-bg: rgba(245,247,251,0.92);
    --success: #15803d;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .35s ease, color .35s ease;
    overflow-x:hidden;
    min-height:100vh;
    padding-bottom: 84px;
  }

  .bg-layer {
    position: fixed; inset:0; z-index:-1; overflow:hidden;
    background:
      radial-gradient(1200px 600px at 110% -10%, rgba(255,106,0,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(43,127,255,0.16), transparent 60%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .bg-layer .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 80%);
    opacity:.6;
  }

  header {
    position: sticky; top:0; z-index: 60;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand { display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-logo {
    height:38px; width:auto; max-width:120px;
    object-fit:contain; display:block;
    filter: drop-shadow(0 4px 12px rgba(255,106,0,0.35));
    flex-shrink:0;
  }
  .brand-title {
    font-size:.92rem; font-weight:800; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.15;
  }
  .brand-title b { color: var(--brand); }
  .header-actions { display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .icon-btn {
    width:40px; height:40px; border-radius:12px;
    border:1px solid var(--border); background: var(--card);
    color: var(--text); font-size:1.05rem;
    display:grid; place-items:center; cursor:pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .icon-btn:active { transform: scale(0.9); }

  /* ====== ANA EKRAN (VİTRİN) ====== */
  .page-view {
    display: none;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .page-view.active {
    display: block;
    opacity: 1;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  .home-hero {
    padding: 40px 18px 20px;
    max-width: 1100px; margin: 0 auto;
    text-align:center;
  }
  .home-hero h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 900; letter-spacing:-0.04em; line-height:1.1;
    margin-bottom: 14px;
  }
  .home-hero h1 .accent {
    background: linear-gradient(120deg, var(--brand), var(--brand2) 60%, #ffb26b);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .home-hero p {
    color: var(--text-dim); font-size:.95rem;
    max-width: 500px; margin: 0 auto; line-height:1.6;
  }

  .main-cat-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
  }
  .main-cat-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 30px 24px;
    background: linear-gradient(145deg, var(--card), var(--card2));
    border: 1px solid var(--border);
    border-radius: 24px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    transition: all .25s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
  }
  .main-cat-card::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 100% 0%, rgba(255,106,0,0.15), transparent 70%);
    opacity: 0; transition: opacity .3s ease;
  }
  .main-cat-card:hover {
    transform: translateY(-5px);
    border-color: var(--brand);
    box-shadow: 0 15px 35px var(--shadow);
  }
  .main-cat-card:hover::before { opacity: 1; }
  .mcc-icon {
    width: 70px; height: 70px; border-radius: 20px;
    background: var(--brand-soft); border: 1px solid rgba(255,106,0,0.3);
    display: grid; place-items: center; font-size: 2.5rem;
    flex-shrink: 0;
  }
  .mcc-info { flex: 1; }
  .mcc-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em; }
  .mcc-desc { font-size: .9rem; color: var(--text-dim); }
  .mcc-arrow { font-size: 1.5rem; color: var(--brand2); opacity: .5; transition: transform .2s; }
  .main-cat-card:hover .mcc-arrow { transform: translateX(5px); opacity: 1; }

  /* ====== ADIM 1: ALT KATEGORİ SEÇİM EKRANI ====== */
  .subcat-screen {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  .subcat-screen.open { display: flex; animation: slideUp .3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .subcat-header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    display: grid; place-items: center; font-size: 1.2rem; cursor: pointer; color: var(--text);
  }
  .cat-screen-title {
    font-size: 1.1rem; font-weight: 800; flex: 1;
    display: flex; align-items: center; gap: 8px;
  }

  .subcat-list {
    padding: 20px;
    max-width: 800px; margin: 0 auto; width: 100%;
    display: flex; flex-direction: column; gap: 12px;
  }
  .subcat-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text); text-decoration: none;
    cursor: pointer; transition: all .2s;
  }
  .subcat-item:hover { border-color: var(--brand); background: var(--card2); transform: translateX(4px); }
  .subcat-name { font-size: 1rem; font-weight: 700; text-transform: capitalize; }
  .subcat-arrow { color: var(--brand2); font-size: 1.2rem; }

  /* ====== ADIM 2: ÜRÜN GÖSTERİM EKRANI ====== */
  .category-screen {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  .category-screen.open { display: flex; animation: slideUp .3s ease; }

  .category-header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .change-cat-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text); font-size: .8rem; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .change-cat-btn:hover { border-color: var(--brand); color: var(--brand2); }

  .category-content {
    flex: 1;
    padding: 16px 16px 100px;
    max-width: 1100px; margin: 0 auto; width: 100%;
  }
  
  .search-toolbar {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .search-box {
    flex: 1;
    display: flex; align-items: center; gap: 9px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px;
    transition: border-color .2s ease;
  }
  .search-box:focus-within { border-color: var(--brand); }
  .search-box .s-ico { font-size: 1rem; color: var(--text-dim); }
  .search-box input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-size: .9rem; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-dim); }

  .search-status {
    display: none;
    width: 100%;
    padding: 10px 14px;
    background: var(--brand-soft);
    border: 1px solid rgba(255,106,0,0.3);
    border-radius: 10px;
    font-size: .85rem;
    color: var(--brand2);
    margin-bottom: 14px;
    align-items: center;
    justify-content: space-between;
  }
  .search-status.show { display: flex; }
  .search-status button {
    background: var(--brand); color: #fff; border: none;
    padding: 4px 10px; border-radius: 6px; font-size: .75rem; font-weight: 700; cursor: pointer;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media(min-width:520px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
  @media(min-width:860px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

  .product-card {
    display: flex; flex-direction: column;
    background: linear-gradient(145deg, var(--card), var(--card2));
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none; color: var(--text);
    position: relative;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    opacity: 0; visibility: hidden;
  }
  .product-card.loaded {
    opacity: 1; visibility: visible;
    animation: fadeIn .3s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .product-card:hover { transform: translateY(-3px); border-color: rgba(255,106,0,0.55); box-shadow: 0 12px 30px var(--shadow); }
  .product-card:active { transform: scale(0.98); }

  .pc-img-wrap {
    position: relative; width: 100%; aspect-ratio: 1/1;
    background: var(--card2); overflow: hidden;
  }
  .pc-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc-badge {
    position: absolute; top: 8px; left: 8px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(255,106,0,0.92); color: #fff;
    font-size: .62rem; font-weight: 800; text-transform: capitalize;
    backdrop-filter: blur(4px);
  }

  .pc-body { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .pc-title {
    font-size: .8rem; font-weight: 750; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.2em;
  }
  .pc-price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
  .pc-price { font-size: .95rem; font-weight: 900; color: var(--brand2); }

  .loading-more { text-align: center; padding: 20px; font-size: .85rem; color: var(--brand2); font-weight: 700; display: none; }
  .loading-more.show { display: block; }
  .empty-state, .loading-state {
    text-align: center; padding: 56px 22px;
    background: var(--card); border: 1px dashed var(--border-strong);
    border-radius: 20px; margin: 20px 0;
  }
  .loading-state .spinner {
    width: 42px; height: 42px; margin: 0 auto 16px;
    border: 4px solid var(--border); border-top-color: var(--brand);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state .ei { font-size: 3rem; margin-bottom: 14px; display: inline-block; }
  .empty-state h3 { font-size: 1.12rem; margin-bottom: 8px; }
  .empty-state p { color: var(--text-dim); font-size: .88rem; line-height: 1.6; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: var(--header-bg);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; background: none; border: none;
    color: var(--text-dim); font-size: .62rem; font-weight: 750;
    cursor: pointer; position: relative; text-decoration: none;
  }
  .nav-btn .ni { font-size: 1.2rem; }
  .nav-btn.active { color: var(--brand2); }
  .nav-btn.active::before {
    content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px; border-radius: 4px;
    background: linear-gradient(90deg, var(--brand), var(--brand2));
  }

  /* MODAL & SETTINGS & LANG */
  .modal-ov {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-ov.open { display: flex; }
  .modal {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; max-width: 620px; width: 100%;
    max-height: 86vh; display: flex; flex-direction: column;
    animation: modalIn .28s ease;
  }
  @keyframes modalIn { from { transform: scale(0.94) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-close { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .modal-body { padding: 18px; overflow-y: auto; }
  .settings-block { margin-bottom: 22px; }
  .settings-lbl { font-size: .76rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
  .theme-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .switch { position: relative; width: 54px; height: 30px; background: var(--card2); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); transition: transform .25s; }
  .switch.on { background: var(--blue); }
  .switch.on::after { transform: translateX(24px); background: #fff; }
  .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .lang-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: .85rem; cursor: pointer; }
  .lang-btn.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand2); font-weight: 800; }

  /* Kategori Seçim Listesi (Modal içinde) */
  .cat-select-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-select-item {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    cursor: pointer; transition: all .2s;
  }
  .cat-select-item:hover { border-color: var(--brand); background: var(--card2); }
  .cat-select-item .csi-icon { font-size: 1.5rem; }
  .cat-select-item .csi-name { font-weight: 700; font-size: 1rem; color: var(--text); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
</style>
</head>
<body>

<div class="bg-layer"><div class="grid"></div></div>

<header>
  <div class="brand">
    <img class="brand-logo" src="https://i.hizliresim.com/oc5c9aq9.png" alt="Daa Studio">
    <div class="brand-title">Hot <b>Products</b></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
  </div>
</header>

<!-- ====== GÖRÜNÜM 1: ANA EKRAN (VİTRİN) ====== -->
<div class="page-view active" id="homeView">
  <section class="home-hero">
    <h1><span data-i18n="heroTitle1">Hot</span> <span class="accent" data-i18n="heroTitle2">Products</span></h1>
    <p data-i18n="heroSub">Kategori seçerek ürünleri inceleyin.</p>
  </section>

  <div class="main-cat-grid" id="mainCatGrid"></div>
</div>

<!-- ====== GÖRÜNÜM 2: ADIM 1 - ALT KATEGORİ SEÇİM EKRANI ====== -->
<div class="subcat-screen" id="subcatScreen">
  <div class="subcat-header">
    <button class="back-btn" id="backToHomeBtn">←</button>
    <div class="cat-screen-title" id="subcatScreenTitle">Kategori</div>
    <button class="icon-btn" id="settingsBtnSub">⚙️</button>
  </div>
  <div class="subcat-list" id="subcatList">
    <!-- JS ile doldurulacak -->
  </div>
</div>

<!-- ====== GÖRÜNÜM 3: ADIM 2 - ÜRÜN GÖSTERİM EKRANI ====== -->
<div class="category-screen" id="categoryScreen">
  <div class="category-header">
    <button class="back-btn" id="backToSubcatBtn">←</button>
    <div class="cat-screen-title" id="productScreenTitle">Ürünler</div>
    <button class="change-cat-btn" id="changeCatBtn">Değiştir</button>
    <button class="icon-btn" id="settingsBtnProd">⚙️</button>
  </div>

  <div class="category-content">
    <div class="search-toolbar">
      <div class="search-box">
        <span class="s-ico">🔍</span>
        <input type="text" id="searchInput" placeholder="Ara..." data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      </div>
    </div>

    <div class="search-status" id="searchStatus">
      <span id="searchStatusText">...</span>
      <button id="clearSearchBtn" data-i18n="clearBtn">İptal Et</button>
    </div>

    <div id="productArea">
      <div class="loading-state">
        <div class="spinner"></div>
        <h3 data-i18n="loading">Yükleniyor…</h3>
        <p data-i18n="loadingSub">Lütfen bekleyin.</p>
      </div>
    </div>

    <div class="loading-more" id="loadingMore">
      <div class="spinner" style="width:24px; height:24px; border-width:3px; margin:0 auto 8px;"></div>
      <span data-i18n="loadingMore">Daha fazla yükleniyor...</span>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="index.html"><span class="ni">🏠</span><span data-i18n="navHome">Ana Sayfa</span></a>
  <a class="nav-btn" href="index.html#promo"><span class="ni">🎟️</span><span data-i18n="navPromo">Promosyon</span></a>
  <a class="nav-btn active" href="hot-products.html"><span class="ni">🔥</span><span data-i18n="navHot">Sıcak Ürünler</span></a>
  <a class="nav-btn" href="index.html#info"><span class="ni">ℹ️</span><span data-i18n="navInfo">Bilgi</span></a>
</nav>

<!-- SETTINGS MODAL -->
<div class="modal-ov" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <h2 data-i18n="settingsTitle">Ayarlar</h2>
      <button class="modal-close" data-close="settings">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-block">
        <div class="settings-lbl" data-i18n="appearance">Görünüm</div>
        <div class="theme-row">
          <span data-i18n="darkMode">Karanlık Mod</span>
          <div class="switch" id="themeSwitch"></div>
        </div>
      </div>
      <div class="settings-block">
        <div class="settings-lbl" data-i18n="language">Dil</div>
        <div class="lang-grid" id="langGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- KATEGORİ DEĞİŞTİRME MODAL -->
<div class="modal-ov" id="changeCatModal">
  <div class="modal">

    fr: { heroTitle1: "Produits", heroTitle2: "Populaires", heroSub: "Choisissez une catégorie.", searchPlaceholder: "Rechercher...", clearBtn: "Effacer", loading: "Chargement…", loadingSub: "Patientez.", loadingMore: "Charger plus...", navHome: "Accueil", navPromo: "Promo", navHot: "Populaires", navInfo: "Info", settingsTitle: "Paramètres", appearance: "Apparence", darkMode: "Sombre", language: "Langue", emptyTitle: "Aucun Produit", emptyText: "Pas de produits ou d'images.", changeCatTitle: "Changer de Catégorie", changeCatBtn: "Changer", allSubcats: "Voir Tous les Produits" },
    it: { heroTitle1: "Prodotti", heroTitle2: "Calda", heroSub: "Seleziona una categoria.", searchPlaceholder: "Cerca...", clearBtn: "Cancella", loading: "Caricamento…", loadingSub: "Attendere.", loadingMore: "Carica altri...", navHome: "Home", navPromo: "Promo", navHot: "Caldi", navInfo: "Info", settingsTitle: "Impostazioni", appearance: "Aspetto", darkMode: "Scuro", language: "Lingua", emptyTitle: "Nessun Prodotto", emptyText: "Nessun prodotto o immagine.", changeCatTitle: "Cambia Categoria", changeCatBtn: "Cambia", allSubcats: "Vedi Tutti i Prodotti" },
    pt: { heroTitle1: "Produtos", heroTitle2: "Quentes", heroSub: "Selecione uma categoria.", searchPlaceholder: "Pesquisar...", clearBtn: "Limpar", loading: "Carregando…", loadingSub: "Aguarde.", loadingMore: "Carregar mais...", navHome: "Início", navPromo: "Promo", navHot: "Quentes", navInfo: "Info", settingsTitle: "Configurações", appearance: "Aparência", darkMode: "Escuro", language: "Idioma", emptyTitle: "Sem Produtos", emptyText: "Nenhum produto ou imagem.", changeCatTitle: "Mudar Categoria", changeCatBtn: "Mudar", allSubcats: "Ver Todos os Produtos" },
    ja: { heroTitle1: "人気", heroTitle2: "商品", heroSub: "カテゴリを選択してください。", searchPlaceholder: "検索...", clearBtn: "クリア", loading: "読み込み中…", loadingSub: "お待ちください。", loadingMore: "さらに読み込む...", navHome: "ホーム", navPromo: "プロモ", navHot: "人気", navInfo: "情報", settingsTitle: "設定", appearance: "外観", darkMode: "ダーク", language: "言語", emptyTitle: "商品なし", emptyText: "商品または画像がありません。", changeCatTitle: "カテゴリ変更", changeCatBtn: "変更", allSubcats: "すべての商品を見る" },
    ko: { heroTitle1: "인기", heroTitle2: "상품", heroSub: "카테고리를 선택하세요.", searchPlaceholder: "검색...", clearBtn: "지우기", loading: "로딩 중…", loadingSub: "잠시만요.", loadingMore: "더 로드 중...", navHome: "홈", navPromo: "프로모", navHot: "인기", navInfo: "정보", settingsTitle: "설정", appearance: "화면", darkMode: "다크", language: "언어", emptyTitle: "상품 없음", emptyText: "상품 또는 이미지가 없습니다.", changeCatTitle: "카테고리 변경", changeCatBtn: "변경", allSubcats: "모든 상품 보기" },
    zh: { heroTitle1: "热门", heroTitle2: "产品", heroSub: "选择一个类别。", searchPlaceholder: "搜索...", clearBtn: "清除", loading: "加载中…", loadingSub: "请稍候。", loadingMore: "加载更多...", navHome: "首页", navPromo: "促销", navHot: "热门", navInfo: "信息", settingsTitle: "设置", appearance: "外观", darkMode: "深色", language: "语言", emptyTitle: "无产品", emptyText: "没有产品或图片。", changeCatTitle: "更换分类", changeCatBtn: "更换", allSubcats: "查看所有产品" }
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ============================================================
     DİL VE TEMA
     ============================================================ */
  var currentLang = "tr";
  try { currentLang = localStorage.getItem("lang") || "tr"; } catch(e){}
  if (!I18N[currentLang]) currentLang = "tr";

  function t(key) {
    var dict = I18N[currentLang] || I18N.tr;
    return dict[key] !== undefined ? dict[key] : (I18N.en[key] || key);
  }

  function applyLang(lang) {
    if (!I18N[lang]) lang = "tr";
    currentLang = lang;
    try { localStorage.setItem("lang", lang); } catch(e){}
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n");
      if (I18N[lang][k] !== undefined) el.textContent = I18N[lang][k];
    });
    
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){
      var k = el.getAttribute("data-i18n-placeholder");
      if (I18N[lang][k] !== undefined) el.setAttribute("placeholder", I18N[lang][k]);
    });

    document.querySelectorAll(".lang-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });

    // Dinamik metinleri güncelle
    renderHomeCategories();
    if(state.activeCategory) {
       var cat = CATEGORIES.find(function(c) { return c.id === state.activeCategory; });
       if(cat) $("subcatScreenTitle").innerHTML = '<span>' + cat.icon + '</span> ' + esc(cat.name);
    }
    renderChangeCatList();
    renderSubcatList(); // Alt kategori listesini yeniden çiz

    if (state.isSearching) {
      performSearch(state.searchQuery);
    } else if (state.currentList.length > 0) {
      renderFilteredList();
    }
  }

  var langGrid = $("langGrid");
  LANGS.forEach(function(L){
    var b = document.createElement("button");
    b.type = "button"; b.className = "lang-btn";
    b.setAttribute("data-lang", L.code);
    b.innerHTML = '<span class="flag">' + L.flag + '</span><span>' + L.label + '</span>';
    b.addEventListener("click", function(){ applyLang(L.code); });
    langGrid.appendChild(b);
  });

  /* ============================================================
     CSV PARSER
     ============================================================ */
  function cleanString(str) {
    if (!str) return "";
    var s = String(str).trim();
    if (s.startsWith('"') && s.endsWith('"')) s = s.slice(1, -1);
    if (s.startsWith("'") && s.endsWith("'")) s = s.slice(1, -1);
    return s.replace(/[\r\n\t]+/g, "").trim();
  }

  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFFFE || text.charCodeAt(1) === 0xFEFF) {
      var newText = "";
      for (var i = 0; i < text.length; i += 2) {
        newText += String.fromCharCode(text.charCodeAt(i) + (text.charCodeAt(i+1) << 8));
      }
      text = newText;
    }
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var firstLine = text.split(/\r?\n/)[0] || "";
    var delimiter = ",";
    if ((firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length) delimiter = ";";

    var rows = [], row = [], field = "", inQuotes = false;
    var i = 0, len = text.length;

    while (i < len) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delimiter) { row.push(field); field = ""; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += ch; i++;
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || (r.length === 1 && r[0].trim() !== ""); });
  }

  function normKey(k) { return String(k || "").toLowerCase().replace(/[\s_\-\.]+/g, "").replace(/[^\w]/g, ""); }

  var FIELD_ALIASES = {
    title: ["title", "productname", "name", "producttitle", "urunadi", "product"],
    image: ["image_url", "productimage", "image", "imageurl", "img", "picture", "photo"],
    url:   ["deep_link", "link", "url", "productlink", "affiliatelink", "afflink"],
    price: ["price", "currentprice", "saleprice", "promotionprice", "discountprice", "fiyat"],
    category: ["category_name", "category", "maincategory", "kategori"]
  };

  function detectColumns(headers) {
    var map = {};
    var normalized = headers.map(normKey);
    Object.keys(FIELD_ALIASES).forEach(function (field) {
      var aliases = FIELD_ALIASES[field];
      for (var a = 0; a < aliases.length; a++) {
        var idx = normalized.indexOf(normKey(aliases[a]));
        if (idx !== -1) { map[field] = idx; return; }
      }
    });
    return map;
  }

  function normalizeImg(url) {
    var u = cleanString(url);
    if (!u) return "";
    if (u.indexOf("//") === 0) u = "https:" + u;
    else if (u.indexOf("http://") === 0) u = u.replace("http://", "https://");
    else if (u.indexOf("https://") !== 0 && u.indexOf(".") !== -1) u = "https://" + u;
    return u;
  }

  function rowToProduct(cells, colMap) {
    function get(field) {
      if (colMap[field] == null) return "";
      return cleanString(cells[colMap[field]]);
    }
    var title = get("title");
    var url = get("url");
    var img = normalizeImg(get("image"));
    var category = get("category");
    
    if (!title || !url || !img) return null;

    return {
      title: title, image: img, url: url,
      price: get("price"), category: category || "General"
    };
  }

  var state = {
    activeCategory: null,
    activeSubCategory: "all",
    cache: {},
    searchQuery: "",
    isSearching: false,
    renderIndex: 0,
    currentList: [],
    availableSubCats: []
  };

  function fetchText(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buffer) {
      var uint8 = new Uint8Array(buffer);
      var isUtf16 = (uint8[0] === 0xFF && uint8[1] === 0xFE) || (uint8[0] === 0xFE && uint8[1] === 0xFF);
      var decoder = new TextDecoder(isUtf16 ? "utf-16" : "utf-8");
      return decoder.decode(buffer);
    });
  }

  function loadCategoryData(catId) {
    return new Promise(function(resolve) {
      if (state.cache[catId]) return resolve(state.cache[catId]);
      
      var cat = CATEGORIES.find(function(c) { return c.id === catId; });
      if (!cat) return resolve([]);

      fetchText(cat.file)
        .then(function(text) {
          var rows = parseCSV(text);
          if (rows.length < 2) throw new Error("Boş dosya");
          
          var headers = rows[0];
          var colMap = detectColumns(headers);
          var products = [];
          
          for (var r = 1; r < rows.length; r++) {
            var p = rowToProduct(rows[r], colMap);
            if (p) products.push(p);
          }

          var uniqueProducts = [];
          var seen = {};
          products.forEach(function(p) {
            var key = p.url;
            if (!seen[key]) { seen[key] = true; uniqueProducts.push(p); }
          });

          state.cache[catId] = uniqueProducts;
          resolve(uniqueProducts);
        })
        .catch(function(err) {
          state.cache[catId] = [];
          resolve([]);
        });
    });
  }

  /* ============================================================
     ADIM 1: ALT KATEGORİ LİSTESİ
     ============================================================ */
  function renderHomeCategories() {
    var grid = $("mainCatGrid");
    grid.innerHTML = "";
    CATEGORIES.forEach(function(cat) {
      var card = document.createElement("div");
      card.className = "main-cat-card";
      card.innerHTML = 
        '<div class="mcc-icon">' + cat.icon + '</div>' +
        '<div class="mcc-info">' +
          '<div class="mcc-title">' + esc(cat.name) + '</div>' +
          '<div class="mcc-desc">' + t("heroSub") + '</div>' +
        '</div>' +
        '<div class="mcc-arrow">→</div>';
      
      card.addEventListener("click", function() { openSubcatScreen(cat.id); });
      grid.appendChild(card);
    });
  }

  function openSubcatScreen(catId) {
    state.activeCategory = catId;
    var cat = CATEGORIES.find(function(c) { return c.id === catId; });
    
    $("subcatScreenTitle").innerHTML = '<span>' + cat.icon + '</span> ' + esc(cat.name);
    $("homeView").classList.remove("active");
    $("subcatScreen").classList.add("open");
    $("categoryScreen").classList.remove("open"); // Ürün ekranı kapalı olsun

    // Veriyi yükle ve alt kategori listesini oluştur
    $("subcatList").innerHTML = '<div class="loading-state" style="background:transparent; border:none;"><div class="spinner"></div></div>';
    
    loadCategoryData(catId).then(function(products) {
      var catSet = {};
      products.forEach(function(p) { if (p.category) catSet[p.category] = 1; });
      state.availableSubCats = Object.keys(catSet).sort();
      renderSubcatList();
    });
  }

  function renderSubcatList() {
    var list = $("subcatList");
    list.innerHTML = "";

    if (state.availableSubCats.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:20px;">' + t("emptyText") + '</p>';
      return;
    }

    // "Tümünü Gör" Butonu
    var allItem = document.createElement("div");
    allItem.className = "subcat-item";
    allItem.innerHTML = 
      '<span class="subcat-name">' + t("allSubcats") + '</span>' +
      '<span class="subcat-arrow">→</span>';
    allItem.addEventListener("click", function() {
      state.activeSubCategory = "all";
      openProductScreen();
    });
    list.appendChild(allItem);

    // Diğer Alt Kategoriler
    state.availableSubCats.forEach(function(sc) {
      var item = document.createElement("div");
      item.className = "subcat-item";
      item.innerHTML = 
        '<span class="subcat-name">' + esc(sc) + '</span>' +
        '<span class="subcat-arrow">→</span>';
      item.addEventListener("click", function() {
        state.activeSubCategory = sc;
        openProductScreen();
      });
      list.appendChild(item);
    });
  }

  /* ============================================================
     ADIM 2: ÜRÜN EKRANI
     ============================================================ */
  function openProductScreen() {
    // Başlığı güncelle
    var title = (state.activeSubCategory === "all") ? t("allSubcats") : state.activeSubCategory;
    $("productScreenTitle").textContent = title;
    
    // Ekranları değiştir
    $("subcatScreen").classList.remove("open");
    $("categoryScreen").classList.add("open");
    
    // Arama çubuğunu temizle
    $("searchInput").value = "";
    state.searchQuery = "";
    state.isSearching = false;
    $("searchStatus").classList.remove("show");

    // Ürünleri göster
    renderFilteredList();
  }

  function closeProductScreen() {
    $("categoryScreen").classList.remove("open");
    $("subcatScreen").classList.add("open");
  }

  function closeAllToHome() {
    $("subcatScreen").classList.remove("open");
    $("categoryScreen").classList.remove("open");
    $("homeView").classList.add("active");
  }

  function renderProductCard(p) {
    var imgHtml = '<img class="pc-img" src="' + esc(p.image) + '" loading="lazy" referrerpolicy="no-referrer" onload="this.closest(\'.product-card\').classList.add(\'loaded\')" onerror="this.closest(\'.product-card\').style.display=\'none\'">';
    
    var badgeHtml = p.category ? '<span class="pc-badge">' + esc(p.category) + '</span>' : '';
    var priceHtml = p.price ? '<span class="pc-price">' + esc(p.price) + '</span>' : '<span class="pc-price" style="color:var(--text-dim);font-size:.78rem;">-</span>';

    return (
      '<a class="product-card" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer sponsored">' +
        '<div class="pc-img-wrap">' + imgHtml + badgeHtml + '</div>' +
        '<div class="pc-body">' +
          '<div class="pc-title">' + esc(p.title) + '</div>' +
          '<div class="pc-price-row">' + priceHtml + '</div>' +
        '</div>' +
      '</a>'
    );
  }

  function appendProducts() {
    var area = $("productArea");
    var list = state.currentList;
    var nextIndex = state.renderIndex + BATCH_SIZE;
    var batch = list.slice(state.renderIndex, nextIndex);
    
    if (state.renderIndex === 0) {
      area.innerHTML = '<div class="product-grid" id="mainGrid"></div>';
    }
    
    var grid = $("mainGrid");
    if (grid) {
      grid.insertAdjacentHTML('beforeend', batch.map(renderProductCard).join(''));
    }
    
    state.renderIndex = nextIndex;

    if (state.renderIndex < list.length) {
      $("loadingMore").classList.add("show");
    } else {
      $("loadingMore").classList.remove("show");
    }
  }

  function renderList(list, emptyMessage) {
    state.currentList = list;
    state.renderIndex = 0;
    
    if (!list || list.length === 0) {
      $("productArea").innerHTML = 
        '<div class="empty-state">' +
          '<div class="ei">📂</div>' +
          '<h3>' + t("emptyTitle") + '</h3>' +
          '<p>' + (emptyMessage || t("emptyText")) + '</p>' +
        '</div>';
      $("loadingMore").classList.remove("show");
      return;
    }
    
    appendProducts();
  }

  function renderFilteredList() {
    var products = state.cache[state.activeCategory] || [];
    
    if (state.activeSubCategory !== "all") {
      products = products.filter(function(p) {
        return p.category === state.activeSubCategory;
      });
    }

    renderList(products, "");
  }

  /* ============================================================
     YENİ: KATEGORİ DEĞİŞTİRME MODALI
     ============================================================ */
  function renderChangeCatList() {
    var list = $("catSelectList");
    list.innerHTML = "";
    CATEGORIES.forEach(function(cat) {
      var item = document.createElement("div");
      item.className = "cat-select-item";
      item.innerHTML = 
        '<span class="csi-icon">' + cat.icon + '</span>' +
        '<span class="csi-name">' + esc(cat.name) + '</span>';
      
      item.addEventListener("click", function() {
        $("changeCatModal").classList.remove("open");
        openSubcatScreen(cat.id);
      });
      list.appendChild(item);
    });
  }

  /* ============================================================
     ARAMA
     ============================================================ */
  function performSearch(query) {
    if (!query) {
      state.isSearching = false;
      $("searchStatus").classList.remove("show");
      renderFilteredList();
      return;
    }

    state.isSearching = true;
    $("searchStatus").classList.add("show");
    $("searchStatusText").textContent = '"' + query + '"...';

    $("productArea").innerHTML = 
      '<div class="loading-state">' +
        '<div class="spinner"></div>' +
        '<h3>' + t("loading") + '</h3>' +
        '<p>' + t("loadingSub") + '</p>' +
      '</div>';

    var q = query.toLowerCase();
    var products = state.cache[state.activeCategory] || [];
    
    // Arama, aktif alt kategori içinde yapılır
    if (state.activeSubCategory !== "all") {
      products = products.filter(function(p) { return p.category === state.activeSubCategory; });
    }
    
    var filtered = products.filter(function(p) {
      var hay = (p.title || "").toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    $("searchStatusText").textContent = '"' + query + '" (' + filtered.length + ')';
    renderList(filtered, "");
  }

  /* ============================================================
     ETKİLEŞİMLER
     ============================================================ */
  $("backToHomeBtn").addEventListener("click", closeAllToHome);
  $("backToSubcatBtn").addEventListener("click", closeProductScreen);

  $("changeCatBtn").addEventListener("click", function() {
    $("changeCatModal").classList.add("open");
  });

  var searchTimer;
  $("searchInput").addEventListener("input", function(e) {
    clearTimeout(searchTimer);
    var val = e.target.value.trim();
    searchTimer = setTimeout(function() {
      state.searchQuery = val;
      performSearch(val);
    }, 400);
  });

  $("clearSearchBtn").addEventListener("click", function() {
    $("searchInput").value = "";
    state.searchQuery = "";
    state.isSearching = false;
    $("searchStatus").classList.remove("show");
    renderFilteredList();
  });

  $("categoryScreen").addEventListener("scroll", function() {
    var loadingMore = $("loadingMore");
    if (!loadingMore.classList.contains("show")) return;
    
    var rect = loadingMore.getBoundingClientRect();
    if (rect.top < window.innerHeight + 200) {
      loadingMore.classList.remove("show");
      setTimeout(appendProducts, 100);
    }
  });

  /* ============ TEMA ============ */
  var currentTheme = "dark";
  try { currentTheme = localStorage.getItem("theme") || "dark"; } catch(e){}
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    currentTheme = theme;
    $("themeSwitch").classList.toggle("on", theme === "dark");
    try { localStorage.setItem("theme", theme); } catch(e){}
  }
  $("themeSwitch").addEventListener("click", function() {
    applyTheme(currentTheme === "dark" ? "light" : "dark");
  });
  applyTheme(currentTheme);

  /* ============ MODAL ============ */
  $("settingsBtn").addEventListener("click", function() { $("settingsModal").classList.add("open"); });
  $("settingsBtnSub").addEventListener("click", function() { $("settingsModal").classList.add("open"); });
  $("settingsBtnProd").addEventListener("click", function() { $("settingsModal").classList.add("open"); });
  
  document.querySelectorAll("[data-close]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var target = btn.getAttribute("data-close");
      if(target === "settings") $("settingsModal").classList.remove("open");
      if(target === "changeCat") $("changeCatModal").classList.remove("open");
    });
  });
  
  $("settingsModal").addEventListener("click", function(e) {
    if (e.target === this) this.classList.remove("open");
  });
  $("changeCatModal").addEventListener("click", function(e) {
    if (e.target === this) this.classList.remove("open");
  });

  // Başlat
  applyLang(currentLang);
  renderHomeCategories();
  renderChangeCatList();

})();
</script>
</body>
</html>
